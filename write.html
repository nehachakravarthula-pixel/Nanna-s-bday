<nav><div class="brand">50 Years of You</div><div class="links"><a href="index.html">Home</a><a href="write.html">Send a Message</a><a href="messages.html">Messages</a></div></nav>
<main class="page full-page"><div class="write-card"><a class="back" href="index.html">← Back to Home</a><h1>Send a Birthday Message 💌</h1><p class="intro">Write a wish, memory, or something you love about Nanna. You can add a photo too, if you’d like.</p><div class="form-row"><label>Your Name</label><input id="name" maxlength="80" placeholder="e.g. Priya, Rahul, Family…"></div><div class="form-row"><label>Your Birthday Wish</label><textarea id="message" maxlength="3000" placeholder="Write your birthday wish, memory, or something you love about Nanna…"></textarea></div><div class="form-row"><label>Add a Photo <span style="font-weight:400;color:#8a807b">(optional)</span></label><input id="photo" type="file" accept="image/*" onchange="previewPhoto()"><img class="preview" id="preview"></div><button class="btn" onclick="submitMessage()">Send Message 💌</button><div class="status" id="status"></div></div></main><script>
const SUPABASE_URL="https://yhgmtvcaptgvmqnczeuc.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_DUCqevIEFnRrJL4UuwiUoQ_wRYgIYD0";
let sb=null,slides=[],slideIndex=0;
async function initSite(){
 if(SUPABASE_URL.startsWith("YOUR_")){loadDemo();return}
 const {createClient}=await import("https://esm.sh/@supabase/supabase-js@2");
 sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
 if(document.getElementById("carousel")) await loadMedia();
 if(document.getElementById("wall")){await loadMessages();sb.channel("messages-live").on("postgres_changes",{event:"*",schema:"public",table:"messages"},loadMessages).subscribe()}
}
function loadDemo(){
 if(document.getElementById("carousel")){slides=[
 {type:"image",url:"https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&w=1600&q=80"},
 {type:"image",url:"https://images.unsplash.com/photo-1506869640319-fe1a24fd76dc?auto=format&fit=crop&w=1600&q=80"},
 {type:"image",url:"https://images.unsplash.com/photo-1511988617509-a57c8a288659?auto=format&fit=crop&w=1600&q=80"}];renderSlides()}
 if(document.getElementById("wall")){const demo=[["A very happy 50th! Wishing you endless happiness, laughter and wonderful memories.","Family"],["Cheers to five decades of being absolutely wonderful. Here’s to many more adventures.","A Friend"],["Happy birthday! Thank you for all the love, stories and laughter you’ve given us.","With love"]];renderMessages(demo.map((x,i)=>({id:i,name:x[1],message:x[0],photo_url:null})))}

async function loadMedia(){const {data,error}=await sb.from("media").select("*").order("display_order");if(!error){slides=data||[];renderSlides()}}
function renderSlides(){const c=document.getElementById("carousel"),d=document.getElementById("dots");if(!c)return;if(!slides.length){c.innerHTML='<div style="aspect-ratio:16/6;display:grid;place-items:center;color:#667085">Add photos/videos from the admin dashboard.</div>';d.innerHTML="";return}c.innerHTML=slides.map((s,i)=>`<div class="slide ${i===0?"active":""}">${s.type==="video"?`<video controls playsinline preload="metadata" src="${s.url}"></video>`:`<img src="${s.url}" alt="Birthday photo" loading="${i?'lazy':'eager'}">`}</div>`).join("");d.innerHTML=slides.map((_,i)=>`<button class="dot ${i===0?"active":""}" onclick="goSlide(${i})"></button>`).join("")}
function goSlide(i){const els=document.querySelectorAll(".slide"),dots=document.querySelectorAll(".dot");if(!els.length)return;slideIndex=(i+els.length)%els.length;els.forEach((e,j)=>e.classList.toggle("active",j===slideIndex));dots.forEach((e,j)=>e.classList.toggle("active",j===slideIndex))}function changeSlide(n){goSlide(slideIndex+n)}
async function loadMessages(){if(!sb)return;const {data,error}=await sb.from("messages").select("*").eq("visible",true).order("created_at",{ascending:false});if(!error)renderMessages(data||[])}
function renderMessages(data){const wall=document.getElementById("wall");if(!wall)return;if(!data.length){wall.innerHTML='<div class="empty">Be the first to leave a birthday wish.</div>';return}wall.innerHTML=data.map(m=>`<article class="card" onclick='openMessage(${JSON.stringify(m).replaceAll("'","&#39;")})'>${m.photo_url?`<img src="${m.photo_url}" alt="">`:""}<div class="msg">${escapeHtml(m.message)}</div><div class="from">— ${escapeHtml(m.name)}</div></article>`).join("")}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
async function submitMessage(){const name=document.getElementById("name").value.trim(),message=document.getElementById("message").value.trim(),file=document.getElementById("photo").files[0],status=document.getElementById("status");if(!name||!message){status.textContent="Please enter your name and message.";return}if(!sb){status.textContent="Demo mode: connect Supabase in the script to save shared messages.";return}status.textContent="Sending…";let photo_url=null;if(file){const ext=file.name.split(".").pop().toLowerCase(),path=`${crypto.randomUUID()}.${ext}`;const up=await sb.storage.from("message-photos").upload(path,file,{contentType:file.type});if(up.error){status.textContent="Photo upload failed. Please try again.";return}photo_url=sb.storage.from("message-photos").getPublicUrl(path).data.publicUrl}const ins=await sb.from("messages").insert({name,message,photo_url,visible:true});if(ins.error){status.textContent=ins.error.message;return}status.textContent="Your message has been added ❤️";document.getElementById("name").value="";document.getElementById("message").value="";document.getElementById("photo").value="";document.getElementById("preview").style.display="none"}

function openMessage(m){document.getElementById("viewContent").innerHTML=`${m.photo_url?`<img src="${m.photo_url}" style="width:100%;max-height:360px;object-fit:cover;border-radius:14px;margin-bottom:22px">`:""}<div class="eyebrow" style="color:#a0834b">A birthday wish</div><div style="font-family:'Playfair Display';font-size:28px;line-height:1.5">${escapeHtml(m.message)}</div><div style="margin-top:22px;font-weight:600">— ${escapeHtml(m.name)}</div>`;document.getElementById("viewModal").classList.add("show")}
function closeModal(){document.getElementById("viewModal").classList.remove("show")}
function confetti(){
 const layer=document.getElementById("confetti");
 if(!layer)return;

 const colors=["#c79552","#f4c95d","#e8ddc8","#ffffff","#d68f79","#24324a"];
 const count=180;
 for(let i=0;i<count;i++){
   const piece=document.createElement("span");
   piece.className="piece";
   const originX=50+(Math.random()-.5)*22;
   const drift=(Math.random()-.5)*70;
   const delay=Math.random()*0.18;
   const duration=2.5+Math.random()*1.8;
   const size=6+Math.random()*7;
   piece.style.left=originX+"%";
   piece.style.width=size+"px";
   piece.style.height=(size*1.6)+"px";
   piece.style.background=colors[i%colors.length];
   piece.style.setProperty("--x",drift+"vw");
   piece.style.setProperty("--r",(Math.random()*900-450)+"deg");
   piece.style.animationDelay=delay+"s";
   piece.style.animationDuration=duration+"s";
   layer.appendChild(piece);
 }
 setTimeout(()=>{layer.innerHTML=""},5200);
}

function startSite(){if(document.body.dataset.home)confetti();initSite()}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",startSite)}else{startSite()}

</script></body></html>
